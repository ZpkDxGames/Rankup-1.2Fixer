name: Build Rankup 1.2 Fixer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rankup-1.2Fixer
          path: target/*.jar
          if-no-files-found: error
